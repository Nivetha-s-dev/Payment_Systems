<form [formGroup]="paymentForm" (ngSubmit)="onSubmit()">
    <h2>{{isEditMode ? 'Edit' : 'Add'}} Payment</h2>

    <mat-form-field>
        <input matInput placeholder="Payee Name" formControlName="payee_name">
        <mat-error *ngIf="paymentForm.get('payee_name')?.hasError('required')">
            Payee name is required
        </mat-error>
    </mat-form-field>

    <mat-form-field>
        <input matInput [matDatepicker]="dueDatePicker" placeholder="Due Date"
               formControlName="due_date">
        <mat-datepicker-toggle matSuffix [for]="dueDatePicker"></mat-datepicker-toggle>
        <mat-datepicker #dueDatePicker></mat-datepicker>
    </mat-form-field>

    <mat-form-field>
        <input matInput type="number" placeholder="Due Amount" formControlName="due_amount">
    </mat-form-field>

    <mat-form-field>
        <mat-select placeholder="Status" formControlName="status">
            <mat-option [value]="PaymentStatus.PENDING">Pending</mat-option>
            <mat-option *ngIf="isEditMode" [value]="PaymentStatus.DUE_NOW">Due Now</mat-option>
            <mat-option *ngIf="isEditMode" [value]="PaymentStatus.COMPLETED">Completed</mat-option>
        </mat-select>
    </mat-form-field>

    <div *ngIf="showEvidenceUpload" class="evidence-upload">
        <input type="file" (change)="onFileSelected($event)" accept="image/*,application/pdf">
        <mat-error *ngIf="evidenceRequired">
            Evidence is required for completed status
        </mat-error>
    </div>

    <div class="actions">
        <button mat-button type="button" (click)="onCancel()">Cancel</button>
        <button mat-raised-button color="primary" type="submit"
                [disabled]="paymentForm.invalid || evidenceRequired">
            Save
        </button>
    </div>
</form>
