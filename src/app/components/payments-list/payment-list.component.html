<div class="payment-list-container">
    <div class="header">
        <h1>Payment Management</h1>
        <button mat-raised-button color="primary" (click)="openPaymentDialog()">
            Add Payment
        </button>
    </div>

    <mat-form-field class="search-field">
        <input matInput [formControl]="searchControl" placeholder="Search payments...">
        <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="table-container">
        <table mat-table [dataSource]="payments" matSort>
            <ng-container matColumnDef="payee_name">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Payee Name</th>
                <td mat-cell *matCellDef="let payment">{{payment.payee_name}}</td>
            </ng-container>

            <ng-container matColumnDef="due_date">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Due Date</th>
                <td mat-cell *matCellDef="let payment">
                    {{payment.due_date | date:'MMM d, y'}}
                </td>
            </ng-container>

            <ng-container matColumnDef="due_amount">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Due Amount</th>
                <td mat-cell *matCellDef="let payment">
                    {{payment.due_amount | currency:payment.currency}}
                </td>
            </ng-container>

            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
                <td mat-cell *matCellDef="let payment">
          <span [class]="'status-badge ' + payment.status">
            {{payment.status}}
          </span>
                </td>
            </ng-container>

            <ng-container matColumnDef="total_due">
                <th mat-header-cell *matHeaderCellDef>Total Due</th>
                <td mat-cell *matCellDef="let payment">
                    {{payment.total_due | currency:payment.currency}}
                </td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef>Actions</th>
                <td mat-cell *matCellDef="let payment">
                    <button mat-icon-button (click)="openPaymentDialog(payment)"
                            matTooltip="Edit Payment">
                        <mat-icon>edit</mat-icon>
                    </button>
                    <button mat-icon-button (click)="deletePayment(payment)"
                            matTooltip="Delete Payment">
                        <mat-icon>delete</mat-icon>
                    </button>
                    <button mat-icon-button *ngIf="payment.evidence_file"
                            (click)="downloadEvidence(payment)"
                            matTooltip="Download Evidence">
                        <mat-icon>download</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        <mat-paginator [length]="totalPayments"
                       [pageSize]="pageSize"
                       [pageSizeOptions]="[5, 10, 25, 100]"
                       (page)="loadPayments()">
        </mat-paginator>
    </div>
</div>
